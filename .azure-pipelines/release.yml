# ONE-OFF BRANCH VERSION - do not merge into master.
#
# Publishes igniteui-react-grids ONLY, from a manually queued run. Differences
# from the master copy of this file:
#   * no tag trigger - the run is queued by hand against this branch,
#   * the version is typed into the `releaseVersion` parameter instead of being
#     read from the tag name,
#   * components and dock-manager are not published at all.
#
# Delete this branch once the one-off release is out; master keeps the real,
# tag-driven release pipeline.

trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

parameters:
- name: releaseVersion
  displayName: 'Version to publish - exact semver, e.g. 21.0.1 or 21.1.0-beta.0'
  type: string

- name: publishToNpm
  displayName: 'Publish to npm registry?'
  type: boolean
  default: true

- name: publishToProdLicensed
  displayName: 'Publish to Production/External Licensed Feed (ProGet)?'
  type: boolean
  default: true

- name: verbose
  displayName: 'Get verbose output from steps - where configurable'
  type: boolean
  default: false

variables:
  # Same rule the tag-driven pipeline applies to the tag name, applied here to
  # the typed version.
  - name: npmPublishTag
    ${{ if or(contains(parameters.releaseVersion, 'rc'), contains(parameters.releaseVersion, 'alpha'), contains(parameters.releaseVersion, 'beta')) }}:
        value: 'next'
    ${{ else }}:
        value: 'latest'

name: $(BuildDefinitionName)_grids_${{ parameters.releaseVersion }}_$(Date:yyyy-MM-dd).$(Rev:r)

jobs:
- job: Trial
  condition: ${{ parameters.publishToNpm }}
  steps:
    # Fail in seconds on a bad version rather than after the full build: `npm
    # version` also accepts keywords like `patch`/`minor`, which would silently
    # bump off the manifest's placeholder 0.0.0 and publish nonsense.
    - task: PowerShell@2
      displayName: 'Validate releaseVersion'
      inputs:
        targetType: inline
        script: |
          $version = '${{ parameters.releaseVersion }}'
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z-.]+)?$') {
            Write-Host "##vso[task.logissue type=error]'$version' is not an exact semver version (e.g. 21.0.1 or 21.1.0-beta.0)."
            exit 1
          }
          Write-Host "Publishing igniteui-react-grids $version under npm dist-tag '$(npmPublishTag)'."

    # build:
    - template: setup-build-test-steps.yml
      parameters:
        verbose: ${{ parameters.verbose }}

    # npm registry auth:
    - task: PowerShell@2
      displayName: 'Ensure empty $(Build.SourcesDirectory)/.npmrc file'
      inputs:
        targetType: 'inline'
        script: 'New-Item -Path . -Name ".npmrc" -ItemType "file" -Force'
        workingDirectory: '$(Build.SourcesDirectory)'

    - task: Npm@1
      displayName: '[npmjs] Add registry in .npmrc'
      inputs:
        command: 'custom'
        workingDir: '$(Build.SourcesDirectory)'
        # required for npmAuthenticate@0 to work https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/npm-authenticate-v0?view=azure-pipelines#npm-1
        customCommand: 'config -L project set registry=https://registry.npmjs.org/'
        verbose: ${{ parameters.verbose }}

    - task: npmAuthenticate@0
      displayName: '[npmjs] npm authenticate'
      inputs:
        workingFile: '$(Build.SourcesDirectory)/.npmrc'
        customEndpoint: 'NPMJS.ORG PUBLIC-NetAdvantage'

    # grids trial release:
    - task: PowerShell@2
      displayName: 'Copy grids package.json'
      inputs:
        targetType: inline
        script: Copy-Item -Path "scripts/grids.package.json" -Destination "dist/package.json"

    # The master pipeline gets away without this because the dock-manager release
    # right before it already left LICENSE_IG in dist/; publishing grids on its
    # own has to copy it explicitly or the package ships with no LICENSE.
    - task: PowerShell@2
      displayName: 'Copy IG license'
      inputs:
        targetType: inline
        script: Copy-Item -Path ".azure-pipelines/artifacts/LICENSE_IG" -Destination "dist/LICENSE"

    - task: PowerShell@2
      displayName: 'Copy grids README'
      inputs:
        targetType: inline
        script: Copy-Item -Path ".azure-pipelines/artifacts/README_Grids.md" -Destination "dist/README.md"

    - task: CopyFiles@2
      displayName: 'Copy Grid themes to dist/grids'
      inputs:
        SourceFolder: 'node_modules/igniteui-webcomponents-grids/grids'
        Contents: 'themes/**'
        TargetFolder: 'dist/grids'

    # mild backfill for all the `import 'igniteui-react-grids/grids/combined';` ಠ_ರೃ
    - script: echo "console.warn(`Importing 'igniteui-react-grids/grids/combined' is not necessary and can be removed.`);export {};" > dist/grids/combined.js
      displayName: "Dummy combined.js"

    - task: Npm@1
      displayName: 'npm version ${{ parameters.releaseVersion }}'
      continueOnError: false
      inputs:
        command: 'custom'
        workingDir: '$(Build.SourcesDirectory)/dist'
        verbose: ${{ parameters.verbose }}
        customCommand: 'version ${{ parameters.releaseVersion }} --no-git-tag-version'

    # Unlike the master pipeline this does NOT continueOnError: a single package
    # is being published here, so a failed publish should fail the build outright
    # instead of hiding in a partially succeeded one.
    - task: Npm@1
      displayName: '[npmjs] npm publish igniteui-react-grids'
      inputs:
        command: 'custom'
        workingDir: '$(Build.SourcesDirectory)/dist'
        customCommand: 'publish --tag $(npmPublishTag) -userconfig ../.npmrc'
        verbose: ${{ parameters.verbose }}

- job: Licensed
  condition: ${{ parameters.publishToProdLicensed }}
  steps:
    # see the note on the same step in the Trial job
    - task: PowerShell@2
      displayName: 'Validate releaseVersion'
      inputs:
        targetType: inline
        script: |
          $version = '${{ parameters.releaseVersion }}'
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z-.]+)?$') {
            Write-Host "##vso[task.logissue type=error]'$version' is not an exact semver version (e.g. 21.0.1 or 21.1.0-beta.0)."
            exit 1
          }
          Write-Host "Publishing @infragistics/igniteui-react-grids $version under npm dist-tag '$(npmPublishTag)'."

    # build:
    - template: setup-build-test-steps.yml
      parameters:
        verbose: ${{ parameters.verbose }}
        licensed: true

    # licensed registry auth:
    - task: PowerShell@2
      displayName: 'Ensure empty $(Build.SourcesDirectory)/.npmrc file'
      inputs:
        targetType: 'inline'
        script: 'New-Item -Path . -Name ".npmrc" -ItemType "file" -Force'
        workingDirectory: '$(Build.SourcesDirectory)'

    - task: Npm@1
      displayName: '[IG Packages] Add registry in .npmrc'
      inputs:
        command: 'custom'
        workingDir: '$(Build.SourcesDirectory)'
        # required for npmAuthenticate@0 to work https://learn.microsoft.com/en-us/azure/devops/pipelines/tasks/reference/npm-authenticate-v0?view=azure-pipelines#npm-1
        customCommand: 'config -L project set @infragistics:registry=https://packages.infragistics.com/npm/js-licensed/'
        verbose: ${{ parameters.verbose }}

    - task: npmAuthenticate@0
      displayName: '[IG Packages] npm authenticate'
      inputs:
        workingFile: '$(Build.SourcesDirectory)/.npmrc'
        customEndpoint: 'public proget'

    # grids licensed release:
    - task: PowerShell@2
      displayName: 'Copy grids package.json'
      inputs:
        targetType: inline
        script: |
          $content = Get-Content -Path "scripts/grids.package.json"
          $updatedContent = $content -replace 'igniteui-webcomponents-grids', '@infragistics/igniteui-webcomponents-grids'
          Set-Content -Path "dist/package.json" -Value $updatedContent

    # see the note on the same step in the Trial job
    - task: PowerShell@2
      displayName: 'Copy IG license'
      inputs:
        targetType: inline
        script: Copy-Item -Path ".azure-pipelines/artifacts/LICENSE_IG" -Destination "dist/LICENSE"

    - task: PowerShell@2
      displayName: 'Copy grids README'
      inputs:
        targetType: inline
        script: Copy-Item -Path ".azure-pipelines/artifacts/README_Grids.md" -Destination "dist/README.md"

    - task: CopyFiles@2
      displayName: 'Copy Grid themes to dist/grids'
      inputs:
        SourceFolder: 'node_modules/igniteui-webcomponents-grids/grids'
        Contents: 'themes/**'
        TargetFolder: 'dist/grids'

    # mild backfill for all the `import 'igniteui-react-grids/grids/combined';` ಠ_ರೃ
    - script: echo "console.warn(`Importing 'igniteui-react-grids/grids/combined' is not necessary and can be removed.`);export {};" > dist/grids/combined.js
      displayName: "Dummy combined.js"

    - task: Npm@1
      displayName: 'npm version ${{ parameters.releaseVersion }}'
      continueOnError: false
      inputs:
        command: 'custom'
        workingDir: '$(Build.SourcesDirectory)/dist'
        verbose: ${{ parameters.verbose }}
        customCommand: 'version ${{ parameters.releaseVersion }} --no-git-tag-version'

    - task: Npm@1
      displayName: 'update package name to @infragistics/igniteui-react-grids'
      continueOnError: false
      inputs:
        command: 'custom'
        workingDir: '$(Build.SourcesDirectory)/dist'
        verbose: ${{ parameters.verbose }}
        customCommand: 'pkg set name="@infragistics/igniteui-react-grids"'

    # see the note on the same step in the Trial job
    - task: Npm@1
      displayName: '[IG Packages] npm publish'
      inputs:
        command: 'custom'
        workingDir: '$(Build.SourcesDirectory)/dist'
        customCommand: 'publish --tag $(npmPublishTag) -userconfig ../.npmrc'
        verbose: ${{ parameters.verbose }}
