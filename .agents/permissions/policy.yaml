# ACS Permission Policy v1.0
# Spec: https://github.com/jackby03/agentic-collaboration-standard/blob/main/spec/v1/08-permissions.md
#
# Evaluation order: deny rules first, then allow rules, then default deny.
# The wrappers under src/components, src/grids, src/grid-lite and src/dock-manager
# are generated by the scripts/build-*.ts generators, so they are denied: change
# the generator instead. package.json stays writable for script changes; lock
# files and build output are denied.

deny:
  read:
    - '.env'
    - '.env.*'
    - '.envrc'
    - '**/.envrc'
    - '**/.env'
    - '**/.env.*'
    - '*.pem'
    - '**/*.pem'
    - '*.key'
    - '**/*.key'
    - '*.pfx'
    - '**/*.pfx'
    - '.npmrc'
    - '**/.npmrc'
  write:
    - '.git/**'
    - 'node_modules/**'
    - '**/node_modules/**'
    - 'dist/**'
    - 'coverage/**'
    - 'test-report/**'
    - 'typedocs/**'
    - 'src/components/**'
    - 'src/grids/**'
    - 'src/grid-lite/**'
    - 'src/dock-manager/**'
    - 'package-lock.json'
    - '**/package-lock.json'
    - '**/yarn.lock'
    - '**/pnpm-lock.yaml'

allow:
  read:
    - '**'
  write:
    - '**'
