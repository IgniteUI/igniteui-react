# Agentic Collaboration Standard (ACS) manifest.
# Spec: https://github.com/jackby03/agentic-collaboration-standard/tree/main/spec/v1
# Schema: https://raw.githubusercontent.com/jackby03/agentic-collaboration-standard/main/schemas/v1/manifest.schema.json
#
# .github/CONTRIBUTING.md holds the contribution workflow and commit conventions,
# and biome.json the lint and format rules. Both win over this folder.
# The skills in .agents/skills/ are for contributors to this repository. The
# end-user skills that ship with the package live in skills/ at the root.

version: '1.0'

project:
  name: 'igniteui-react'
  description: 'Ignite UI for React: React wrappers for the Ignite UI Web Components, Grids, Grid Lite and Dock Manager, generated from their custom elements manifests with @lit/react and published as igniteui-react, igniteui-react-grids and igniteui-react-dockmanager.'
  language: typescript
  framework: react

layers:
  context: true # context/project.md
  skills: true # .agents/skills/ (contributor workflows)
  commands: false # no reusable single-shot commands defined yet
  agents: false # no custom agents defined yet
  permissions: true # permissions/policy.yaml

compatible_with:
  - github-copilot
  - claude-code
  - cursor
  - codex
  - any
