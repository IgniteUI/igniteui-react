name: Npm.js deploy

# Replaces the Azure DevOps release pipeline (.azure-pipelines/release.yml). All release logic
# lives inline in this file on purpose - there is no steps-template equivalent to Azure's
# setup-build-test-steps.yml here.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Get verbose output from steps - where configurable'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}

env:
  NODE_VERSION: '24.x'
  # release.tag_name for a real release; falls back to the ref name so this can be exercised
  # via workflow_dispatch against a tag while publishing is disabled.
  VERSION: ${{ github.event.release.tag_name || github.ref_name }}

jobs:
  # Builds and inventories the npmjs.org release. Holds no publishing rights and no OIDC token.
  build-npmjs:
    name: Build & inventory (npmjs.org)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      npm-tag: ${{ steps.npm-tag.outputs.npm-tag }}
      components-tarball: ${{ steps.pack-components.outputs.tarball }}
      components-sha256: ${{ steps.pack-components.outputs.sha256 }}
      components-sbom: ${{ steps.sbom.outputs.components }}
      dockmanager-tarball: ${{ steps.pack-dockmanager.outputs.tarball }}
      dockmanager-sha256: ${{ steps.pack-dockmanager.outputs.sha256 }}
      dockmanager-sbom: ${{ steps.sbom.outputs.dockmanager }}
      grids-tarball: ${{ steps.pack-grids.outputs.tarball }}
      grids-sha256: ${{ steps.pack-grids.outputs.sha256 }}
      grids-sbom: ${{ steps.sbom.outputs.grids }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # No dependency cache: a release build must resolve from the registry, not from a cache entry.
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: npm ci
        run: npm ci ${{ inputs.verbose && '--loglevel verbose' || '' }}

      - name: Build
        run: npm run build ${{ inputs.verbose && '--loglevel verbose' || '' }}

      - name: Validate dist packages
        run: npm run validate:dist ${{ inputs.verbose && '--loglevel verbose' || '' }}

      - name: Lint
        run: npm run lint ${{ inputs.verbose && '--loglevel verbose' || '' }}

      - name: Install Playwright browsers
        run: npx playwright install chromium-headless-shell

      - name: Test
        run: npm run test:ci ${{ inputs.verbose && '--loglevel verbose' || '' }}
        env:
          CI: 'true'

      - name: Define npm tag
        id: npm-tag
        run: |
          set -euo pipefail
          if [[ "$VERSION" == *alpha* || "$VERSION" == *beta* || "$VERSION" == *rc* ]]; then
            echo "npm-tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "npm-tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # components release:
      - name: Copy components package.json
        run: cp scripts/components.package.json dist/package.json

      - name: Copy MIT license
        run: cp .azure-pipelines/artifacts/LICENSE_MIT dist/LICENSE

      - name: Copy skills folder
        run: cp -r skills dist/skills

      - name: Copy components README
        run: cp .azure-pipelines/artifacts/README_Components.md dist/README.md

      - name: Version components package
        run: npm version "$VERSION" --no-git-tag-version
        working-directory: dist

      - name: Pack components package
        id: pack-components
        run: |
          set -euo pipefail
          mkdir -p artifacts
          file=$(npm pack ./dist --pack-destination artifacts --json | node -e "
            const p = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const e = Array.isArray(p) ? p[0] : Object.values(p)[0];
            console.log(e.filename);
          ")
          echo "tarball=${file}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "artifacts/${file}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Remove skills folder
        run: rm -rf dist/skills

      # dock-manager release:
      - name: Copy dock-manager package.json
        run: cp scripts/dock-manager.package.json dist/package.json

      - name: Copy IG license
        run: cp .azure-pipelines/artifacts/LICENSE_IG dist/LICENSE

      - name: Copy dock-manager README
        run: cp .azure-pipelines/artifacts/README_DockManager.md dist/README.md

      - name: Version dock-manager package
        run: npm version "$VERSION" --no-git-tag-version
        working-directory: dist

      - name: Pack dock-manager package
        id: pack-dockmanager
        run: |
          set -euo pipefail
          file=$(npm pack ./dist --pack-destination artifacts --json | node -e "
            const p = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const e = Array.isArray(p) ? p[0] : Object.values(p)[0];
            console.log(e.filename);
          ")
          echo "tarball=${file}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "artifacts/${file}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # grids release:
      - name: Copy grids package.json
        run: cp scripts/grids.package.json dist/package.json

      - name: Copy grids README
        run: cp .azure-pipelines/artifacts/README_Grids.md dist/README.md

      - name: Copy grid themes to dist/grids
        run: |
          mkdir -p dist/grids
          cp -r node_modules/igniteui-webcomponents-grids/grids/themes dist/grids/

      # mild backfill for all the `import 'igniteui-react-grids/grids/combined';` ಠ_ರೃ
      - name: Add dummy combined.js
        run: |
          echo "console.warn(\`Importing 'igniteui-react-grids/grids/combined' is not necessary and can be removed.\`);export {};" > dist/grids/combined.js

      - name: Version grids package
        run: npm version "$VERSION" --no-git-tag-version
        working-directory: dist

      - name: Pack grids package
        id: pack-grids
        run: |
          set -euo pipefail
          file=$(npm pack ./dist --pack-destination artifacts --json | node -e "
            const p = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const e = Array.isArray(p) ? p[0] : Object.values(p)[0];
            console.log(e.filename);
          ")
          echo "tarball=${file}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "artifacts/${file}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # One SBOM per package: the packed tarball plus the production dependency tree a consumer
      # installs. Unpacked outside the workspace so the repo's lockfile and dev tooling can't leak in.
      - name: Generate per-package SBOMs (CycloneDX 1.6)
        id: sbom
        env:
          COMPONENTS: ${{ steps.pack-components.outputs.tarball }}
          DOCKMANAGER: ${{ steps.pack-dockmanager.outputs.tarball }}
          GRIDS: ${{ steps.pack-grids.outputs.tarball }}
        run: |
          set -euo pipefail
          # The pinned devDependency, invoked by path so it is never downloaded at release time.
          cyclonedx="$GITHUB_WORKSPACE/node_modules/.bin/cyclonedx-npm"
          for entry in "components=$COMPONENTS" "dockmanager=$DOCKMANAGER" "grids=$GRIDS"; do
            key=${entry%%=*}
            tarball=${entry#*=}
            sbom="${tarball%.tgz}.cdx.json"
            workdir="$RUNNER_TEMP/sbom-$key"
            mkdir -p "$workdir"
            tar -xzf "artifacts/$tarball" -C "$workdir"
            (
              cd "$workdir/package"
              npm install --omit=dev --ignore-scripts --no-audit --no-fund
              # Not --output-reproducible: it drops serialNumber, which actions/attest requires.
              "$cyclonedx" --spec-version 1.6 --output-format JSON --mc-type library --omit dev --validate \
                --output-file "$GITHUB_WORKSPACE/artifacts/$sbom"
            )
            echo "$key=$sbom" >> "$GITHUB_OUTPUT"
          done

      - name: Summarize packed artifacts
        run: |
          { echo "### Packed artifacts (npmjs.org)"; echo '```'; sha256sum artifacts/*.tgz; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npmjs-release-artifacts
          path: artifacts/*
          retention-days: 30
          if-no-files-found: error

  attest-npmjs:
    name: Attest artifacts (npmjs.org)
    needs: build-npmjs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      # Artifact attestations are unavailable in private repositories outside GitHub Enterprise Cloud.
      ATTESTATIONS_ENABLED: ${{ !github.event.repository.private }}
      COMPONENTS_SBOM: ${{ needs.build-npmjs.outputs.components-sbom }}
      DOCKMANAGER_SBOM: ${{ needs.build-npmjs.outputs.dockmanager-sbom }}
      GRIDS_SBOM: ${{ needs.build-npmjs.outputs.grids-sbom }}

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npmjs-release-artifacts
          path: artifacts

      - name: Verify packed artifacts match the build
        env:
          EXPECTED: |
            ${{ needs.build-npmjs.outputs.components-sha256 }}  ${{ needs.build-npmjs.outputs.components-tarball }}
            ${{ needs.build-npmjs.outputs.dockmanager-sha256 }}  ${{ needs.build-npmjs.outputs.dockmanager-tarball }}
            ${{ needs.build-npmjs.outputs.grids-sha256 }}  ${{ needs.build-npmjs.outputs.grids-tarball }}
        run: |
          set -euo pipefail
          cd artifacts
          printf '%s\n' "$EXPECTED" | sha256sum --check --strict

      - name: Attest build provenance
        id: attest-provenance
        if: env.ATTESTATIONS_ENABLED == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/*.tgz

      - name: Attest SBOM (igniteui-react)
        id: attest-sbom-components
        if: env.ATTESTATIONS_ENABLED == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/${{ needs.build-npmjs.outputs.components-tarball }}
          sbom-path: artifacts/${{ env.COMPONENTS_SBOM }}

      - name: Attest SBOM (igniteui-react-dockmanager)
        id: attest-sbom-dockmanager
        if: env.ATTESTATIONS_ENABLED == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/${{ needs.build-npmjs.outputs.dockmanager-tarball }}
          sbom-path: artifacts/${{ env.DOCKMANAGER_SBOM }}

      - name: Attest SBOM (igniteui-react-grids)
        id: attest-sbom-grids
        if: env.ATTESTATIONS_ENABLED == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/${{ needs.build-npmjs.outputs.grids-tarball }}
          sbom-path: artifacts/${{ env.GRIDS_SBOM }}

      # Each <package>.cdx.json is released next to its signed <package>.cdx.sigstore.json.
      - name: Collect attestation bundles
        if: env.ATTESTATIONS_ENABLED == 'true'
        run: |
          set -euo pipefail
          mkdir -p attestations
          cp "${{ steps.attest-provenance.outputs.bundle-path }}" attestations/provenance.sigstore.json
          cp "${{ steps.attest-sbom-components.outputs.bundle-path }}" "attestations/${COMPONENTS_SBOM%.json}.sigstore.json"
          cp "${{ steps.attest-sbom-dockmanager.outputs.bundle-path }}" "attestations/${DOCKMANAGER_SBOM%.json}.sigstore.json"
          cp "${{ steps.attest-sbom-grids.outputs.bundle-path }}" "attestations/${GRIDS_SBOM%.json}.sigstore.json"

          {
            echo "### Attestations"
            echo "- Provenance (all packages): ${{ steps.attest-provenance.outputs.attestation-url }}"
            echo "- SBOM igniteui-react: ${{ steps.attest-sbom-components.outputs.attestation-url }}"
            echo "- SBOM igniteui-react-dockmanager: ${{ steps.attest-sbom-dockmanager.outputs.attestation-url }}"
            echo "- SBOM igniteui-react-grids: ${{ steps.attest-sbom-grids.outputs.attestation-url }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload attestation bundles
        if: env.ATTESTATIONS_ENABLED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npmjs-attestations
          path: attestations/*
          retention-days: 30
          if-no-files-found: error

  publish-npmjs:
    name: Publish to npmjs.org
    needs: [build-npmjs, attest-npmjs]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm Deploy
    permissions:
      id-token: write

    steps:
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npmjs-release-artifacts
          path: artifacts

      - name: Verify packed artifacts match the build
        env:
          EXPECTED: |
            ${{ needs.build-npmjs.outputs.components-sha256 }}  ${{ needs.build-npmjs.outputs.components-tarball }}
            ${{ needs.build-npmjs.outputs.dockmanager-sha256 }}  ${{ needs.build-npmjs.outputs.dockmanager-tarball }}
            ${{ needs.build-npmjs.outputs.grids-sha256 }}  ${{ needs.build-npmjs.outputs.grids-tarball }}
        run: |
          set -euo pipefail
          cd artifacts
          printf '%s\n' "$EXPECTED" | sha256sum --check --strict

      # Publishing the packed tarball guarantees the published bytes are the attested bytes.
      # Authentication and npm provenance both come from the OIDC token - no npm token needed.
      - name: Publish igniteui-react
        env:
          NPM_TAG: ${{ needs.build-npmjs.outputs.npm-tag }}
          TARBALL: ${{ needs.build-npmjs.outputs.components-tarball }}
        run: npm publish "./artifacts/$TARBALL" --tag "$NPM_TAG" --provenance

      - name: Publish igniteui-react-dockmanager
        env:
          NPM_TAG: ${{ needs.build-npmjs.outputs.npm-tag }}
          TARBALL: ${{ needs.build-npmjs.outputs.dockmanager-tarball }}
        run: npm publish "./artifacts/$TARBALL" --tag "$NPM_TAG" --provenance

      - name: Publish igniteui-react-grids
        env:
          NPM_TAG: ${{ needs.build-npmjs.outputs.npm-tag }}
          TARBALL: ${{ needs.build-npmjs.outputs.grids-tarball }}
        run: npm publish "./artifacts/$TARBALL" --tag "$NPM_TAG" --provenance

  attach-release-npmjs:
    name: Attach release evidence (npmjs.org)
    needs: [build-npmjs, attest-npmjs]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npmjs-release-artifacts
          path: artifacts

      - name: Download attestation bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: npmjs-attestations
          path: attestations

      - name: Attach evidence to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$VERSION" --clobber -R "${{ github.repository }}" \
            artifacts/*.tgz \
            artifacts/*.cdx.json \
            $(ls attestations/*.json 2>/dev/null || true)

  # Builds and inventories the licensed (@infragistics-scoped) release for the ProGet feed.
  # Holds no publishing rights.
  build-proget:
    name: Build (ProGet licensed feed)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      npm-tag: ${{ steps.npm-tag.outputs.npm-tag }}
      components-tarball: ${{ steps.pack-components.outputs.tarball }}
      components-sha256: ${{ steps.pack-components.outputs.sha256 }}
      dockmanager-tarball: ${{ steps.pack-dockmanager.outputs.tarball }}
      dockmanager-sha256: ${{ steps.pack-dockmanager.outputs.sha256 }}
      grids-tarball: ${{ steps.pack-grids.outputs.tarball }}
      grids-sha256: ${{ steps.pack-grids.outputs.sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # No dependency cache: a release build must resolve from the registry, not from a cache entry.
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: npm ci
        run: npm ci ${{ inputs.verbose && '--loglevel verbose' || '' }}

      - name: Build
        run: npm run build ${{ inputs.verbose && '--loglevel verbose' || '' }}
        env:
          IG_LICENSED_BUILD: 'true'

      - name: Validate dist packages
        run: npm run validate:dist ${{ inputs.verbose && '--loglevel verbose' || '' }}

      - name: Lint
        run: npm run lint ${{ inputs.verbose && '--loglevel verbose' || '' }}

      - name: Install Playwright browsers
        run: npx playwright install chromium-headless-shell

      - name: Test
        run: npm run test:ci ${{ inputs.verbose && '--loglevel verbose' || '' }}
        env:
          CI: 'true'

      - name: Define npm tag
        id: npm-tag
        run: |
          set -euo pipefail
          if [[ "$VERSION" == *alpha* || "$VERSION" == *beta* || "$VERSION" == *rc* ]]; then
            echo "npm-tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "npm-tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # components licensed release:
      - name: Copy components package.json
        run: cp scripts/components.package.json dist/package.json

      - name: Copy MIT license
        run: cp .azure-pipelines/artifacts/LICENSE_MIT dist/LICENSE

      - name: Copy components README
        run: cp .azure-pipelines/artifacts/README_Components.md dist/README.md

      - name: Version components package
        run: npm version "$VERSION" --no-git-tag-version
        working-directory: dist

      - name: Rename package to @infragistics/igniteui-react
        run: npm pkg set name="@infragistics/igniteui-react"
        working-directory: dist

      - name: Add deprecation postinstall script
        run: |
          npm pkg set scripts.postinstall='echo "⚠️ Deprecated(@infragistics/igniteui-react): Now distributed as MIT, use igniteui-react from the npmjs.org registry instead."'
        working-directory: dist

      - name: Pack components package
        id: pack-components
        run: |
          set -euo pipefail
          mkdir -p artifacts
          file=$(npm pack ./dist --pack-destination artifacts --json | node -e "
            const p = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const e = Array.isArray(p) ? p[0] : Object.values(p)[0];
            console.log(e.filename);
          ")
          echo "tarball=${file}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "artifacts/${file}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # dock-manager licensed release:
      - name: Copy dock-manager package.json
        run: cp scripts/dock-manager.package.json dist/package.json

      - name: Copy IG license
        run: cp .azure-pipelines/artifacts/LICENSE_IG dist/LICENSE

      - name: Copy dock-manager README
        run: cp .azure-pipelines/artifacts/README_DockManager.md dist/README.md

      - name: Version dock-manager package
        run: npm version "$VERSION" --no-git-tag-version
        working-directory: dist

      # The licensed wrappers import @infragistics/igniteui-dockmanager, so its dependency moves scope too.
      - name: Rename package and its dependency to @infragistics scope
        run: |
          set -euo pipefail
          npm pkg set name="@infragistics/igniteui-react-dockmanager"
          range=$(npm pkg get dependencies.igniteui-dockmanager | tr -d '"')
          [[ "$range" != "{}" ]] || { echo "::error::igniteui-dockmanager is not in dependencies"; exit 1; }
          npm pkg set "dependencies.@infragistics/igniteui-dockmanager=$range"
          npm pkg delete dependencies.igniteui-dockmanager
        working-directory: dist

      - name: Pack dock-manager package
        id: pack-dockmanager
        run: |
          set -euo pipefail
          file=$(npm pack ./dist --pack-destination artifacts --json | node -e "
            const p = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const e = Array.isArray(p) ? p[0] : Object.values(p)[0];
            console.log(e.filename);
          ")
          echo "tarball=${file}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "artifacts/${file}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # grids licensed release:
      - name: Copy grids package.json
        run: cp scripts/grids.package.json dist/package.json

      - name: Copy grids README
        run: cp .azure-pipelines/artifacts/README_Grids.md dist/README.md

      - name: Copy grid themes to dist/grids
        run: |
          mkdir -p dist/grids
          cp -r node_modules/igniteui-webcomponents-grids/grids/themes dist/grids/

      # mild backfill for all the `import 'igniteui-react-grids/grids/combined';` ಠ_ರೃ
      - name: Add dummy combined.js
        run: |
          echo "console.warn(\`Importing 'igniteui-react-grids/grids/combined' is not necessary and can be removed.\`);export {};" > dist/grids/combined.js

      - name: Version grids package
        run: npm version "$VERSION" --no-git-tag-version
        working-directory: dist

      # The licensed wrappers import @infragistics/igniteui-webcomponents-grids, so its dependency moves scope too.
      - name: Rename package and its dependency to @infragistics scope
        run: |
          set -euo pipefail
          npm pkg set name="@infragistics/igniteui-react-grids"
          range=$(npm pkg get dependencies.igniteui-webcomponents-grids | tr -d '"')
          [[ "$range" != "{}" ]] || { echo "::error::igniteui-webcomponents-grids is not in dependencies"; exit 1; }
          npm pkg set "dependencies.@infragistics/igniteui-webcomponents-grids=$range"
          npm pkg delete dependencies.igniteui-webcomponents-grids
        working-directory: dist

      - name: Pack grids package
        id: pack-grids
        run: |
          set -euo pipefail
          file=$(npm pack ./dist --pack-destination artifacts --json | node -e "
            const p = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const e = Array.isArray(p) ? p[0] : Object.values(p)[0];
            console.log(e.filename);
          ")
          echo "tarball=${file}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "artifacts/${file}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Summarize packed artifacts
        run: |
          { echo "### Packed artifacts (ProGet licensed feed)"; echo '```'; sha256sum artifacts/*.tgz; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proget-release-artifacts
          path: artifacts/*
          retention-days: 30
          if-no-files-found: error

  publish-proget:
    name: Publish to ProGet (licensed feed)
    needs: build-proget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ProGet Deploy
    permissions: {}

    steps:
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # ProGet expects basic auth (`_auth`, the secret is already base64), not the bearer
      # `_authToken` that setup-node's registry-url writes. The .npmrc only references the
      # variable, so the secret is never written to disk.
      - name: Configure ProGet registry
        run: |
          set -euo pipefail
          npmrc="$RUNNER_TEMP/proget.npmrc"
          cat > "$npmrc" <<'EOF'
          @infragistics:registry=https://packages.infragistics.com/npm/js-licensed/
          //packages.infragistics.com/npm/js-licensed/:_auth=${PROGET_NPM_AUTH}
          EOF
          echo "NPM_CONFIG_USERCONFIG=$npmrc" >> "$GITHUB_ENV"

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: proget-release-artifacts
          path: artifacts

      - name: Verify packed artifacts match the build
        env:
          EXPECTED: |
            ${{ needs.build-proget.outputs.components-sha256 }}  ${{ needs.build-proget.outputs.components-tarball }}
            ${{ needs.build-proget.outputs.dockmanager-sha256 }}  ${{ needs.build-proget.outputs.dockmanager-tarball }}
            ${{ needs.build-proget.outputs.grids-sha256 }}  ${{ needs.build-proget.outputs.grids-tarball }}
        run: |
          set -euo pipefail
          cd artifacts
          printf '%s\n' "$EXPECTED" | sha256sum --check --strict

      - name: Publish @infragistics/igniteui-react
        env:
          PROGET_NPM_AUTH: ${{ secrets.PACKAGES_INFRAGISTICS_COM_NPM_TOKEN }}
          NPM_TAG: ${{ needs.build-proget.outputs.npm-tag }}
          TARBALL: ${{ needs.build-proget.outputs.components-tarball }}
        run: npm publish "./artifacts/$TARBALL" --tag "$NPM_TAG"

      - name: Publish @infragistics/igniteui-react-dockmanager
        env:
          PROGET_NPM_AUTH: ${{ secrets.PACKAGES_INFRAGISTICS_COM_NPM_TOKEN }}
          NPM_TAG: ${{ needs.build-proget.outputs.npm-tag }}
          TARBALL: ${{ needs.build-proget.outputs.dockmanager-tarball }}
        run: npm publish "./artifacts/$TARBALL" --tag "$NPM_TAG"

      - name: Publish @infragistics/igniteui-react-grids
        env:
          PROGET_NPM_AUTH: ${{ secrets.PACKAGES_INFRAGISTICS_COM_NPM_TOKEN }}
          NPM_TAG: ${{ needs.build-proget.outputs.npm-tag }}
          TARBALL: ${{ needs.build-proget.outputs.grids-tarball }}
        run: npm publish "./artifacts/$TARBALL" --tag "$NPM_TAG"
